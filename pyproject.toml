[project]
name = "tufazip"
version = "0.1.0"
requires-python = "==3.12.3"
dependencies = [
    "numpy==2.4.6",
    "tensorboard==2.20.0",
    "torch==2.12.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
